<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#080D18"/><stop offset=".55" stop-color="#101827"/><stop offset="1" stop-color="#241D18"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#9A6B3B" stop-opacity=".28"/><stop offset="1" stop-color="#9A6B3B" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8E3A0"/><stop offset=".5" stop-color="#D6A24A"/><stop offset="1" stop-color="#93652F"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#F8E3A0" stop-opacity="0"/><stop offset=".5" stop-color="#F8E3A0" stop-opacity=".65"/><stop offset="1" stop-color="#F8E3A0" stop-opacity="0"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
