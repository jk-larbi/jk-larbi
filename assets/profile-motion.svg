<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#111110"/><stop offset=".58" stop-color="#201B16"/><stop offset="1" stop-color="#342313"/>
  </linearGradient>
  <linearGradient id="gold" x1="180" y1="40" x2="1030" y2="230" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FDE68A"/><stop offset=".48" stop-color="#D6A24A"/><stop offset="1" stop-color="#8D5A22"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#FDE68A" stop-opacity="0"/><stop offset=".5" stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1200" height="270" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="270" fill="url(#bg)"/>
  <path d="M0 210 C210 150 350 300 580 205 S940 90 1200 160" stroke="#D6A24A" stroke-opacity=".13" stroke-width="1"/>
  <path d="M0 225 C250 165 390 285 620 220 S980 120 1200 185" stroke="#FDE68A" stroke-opacity=".08" stroke-width="1"/>
  <circle cx="1000" cy="105" r="94" stroke="#D6A24A" stroke-opacity=".15"/>
  <circle cx="1000" cy="105" r="68" stroke="#D6A24A" stroke-opacity=".24" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1000 105" to="360 1000 105" dur="48s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="1000" cy="105" rx="115" ry="39" transform="rotate(-28 1000 105)" stroke="#E7B65D" stroke-opacity=".35"/>
  <circle cx="1101" cy="51" r="4" fill="#FDE68A" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="145" r="2.5" fill="#FDE68A"><animate attributeName="opacity" values=".2;.9;.2" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1065" cy="175" r="2" fill="#D6A24A"><animate attributeName="opacity" values=".25;.8;.25" dur="5.2s" repeatCount="indefinite"/></circle>
  <g opacity=".5">
    <path d="M0 32H1200" stroke="#E7B65D" stroke-opacity=".12"/>
    <path d="M0 238H1200" stroke="#E7B65D" stroke-opacity=".12"/>
  </g>
  <rect x="-260" y="0" width="180" height="270" fill="url(#sweep)" opacity=".45" transform="skewX(-18)">
    <animate attributeName="x" from="-300" to="1450" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="82" y="79" fill="#D6A24A" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">DESIGN  /  ENGINEERING  /  CURIOSITY</text>
  <text x="78" y="145" fill="#FAFAF9" font-family="Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="1">JOSHUA KOFI LARBI</text>
  <text x="82" y="180" fill="#D6D3D1" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">CREATIVE THINKER  ·  TECHNOLOGY BUILDER</text>
  <path d="M82 207H410" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="414" cy="207" r="3" fill="#FDE68A" filter="url(#glow)"/>
  <text x="82" y="239" fill="#A8A29E" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">BUILD WITH INTENTION.</text>
</g>
</svg>