<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Black Star Orbit — UI Lead contribution</title>
<desc id="desc">A dark, cinematic space-inspired banner with animated orbital paths and a glowing infrared star, highlighting a UI Lead contribution to a NASA Space Apps Challenge 2026 team project.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F1D"/><stop offset=".55" stop-color="#111D31"/><stop offset="1" stop-color="#241A36"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#FFD88A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD88A" stop-opacity="0"/></radialGradient>
  <linearGradient id="orbit"><stop stop-color="#79B8FF" stop-opacity="0"/><stop offset=".5" stop-color="#9BCBFF" stop-opacity=".8"/><stop offset="1" stop-color="#C6A7FF" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<g fill="#DDEBFF">
 <circle cx="770" cy="44" r="1.4"/><circle cx="850" cy="250" r="1.2"/><circle cx="1110" cy="66" r="1.3"/><circle cx="1050" cy="230" r="1"/><circle cx="690" cy="220" r="1"/><circle cx="1160" cy="180" r="1.2"/>
 <circle cx="930" cy="36" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="740" cy="170" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(970 150)" fill="none">
 <circle r="112" fill="url(#glow)" filter="url(#blur)"/>
 <ellipse rx="205" ry="67" stroke="url(#orbit)" stroke-width="1.5" transform="rotate(-18)"/>
 <ellipse rx="164" ry="48" stroke="#A7C7FF" stroke-opacity=".35" transform="rotate(24)"/>
 <ellipse rx="238" ry="91" stroke="#B9A2FF" stroke-opacity=".22" stroke-dasharray="3 9" transform="rotate(9)"/>
 <circle r="31" fill="#F6D9A0" fill-opacity=".14" stroke="#F5D7A0" stroke-opacity=".55"/>
 <circle r="17" fill="#FFE3AD"><animate attributeName="r" values="15;18;15" dur="3.6s" repeatCount="indefinite"/></circle>
 <circle r="35" stroke="#FFE3AD" stroke-opacity=".5"><animate attributeName="r" values="28;47;28" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;.65" dur="3.6s" repeatCount="indefinite"/></circle>
 <circle r="5" fill="#A8D4FF"><animateMotion dur="13s" repeatCount="indefinite" path="M-205 0A205 67 -18 1 0 205 0A205 67 -18 1 0 -205 0"/></circle>
 <circle r="4" fill="#D7B9FF"><animateMotion dur="18s" repeatCount="indefinite" path="M-164 0A164 48 24 1 0 164 0A164 48 24 1 0 -164 0"/></circle>
</g>
<path d="M64 48H1136" stroke="#D9E7FF" stroke-opacity=".13"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="68" y="78" fill="#A9C9F7" font-size="12" letter-spacing="3.4">SELECTED COLLABORATION / 2026</text>
 <text x="66" y="145" fill="#F6F4F0" font-size="39" font-weight="700" letter-spacing="-.8">BLACK STAR ORBIT</text>
 <text x="69" y="178" fill="#D5DCE8" font-size="16" letter-spacing="1.2">THE INFRARED SKY TIME MACHINE</text>
 <rect x="68" y="207" width="190" height="29" rx="14.5" fill="#A8C9FF" fill-opacity=".13" stroke="#A8C9FF" stroke-opacity=".55"/>
 <text x="84" y="226" fill="#D9E8FF" font-size="11" font-weight="700" letter-spacing="1.6">UI LEAD / UI DESIGN</text>
 <text x="278" y="226" fill="#B8C3D4" font-size="12" letter-spacing="1.2">NASA SPACE APPS CHALLENGE 2026</text>
</g>
<path d="M64 258H1136" stroke="#D9E7FF" stroke-opacity=".13"/>
</svg>